<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05050f">
  <title>Día de las Flores Amarillas 🌼</title>

  <!-- Tipografía: Fraunces (títulos, cálida y orgánica) + DM Sans (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">

  <!-- Three.js vía CDN con importmap (jsDelivr envía cabeceras CORS: sin bloqueos) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin="anonymous">

  <style>
    :root {
      --acento: #ffd700;            /* lo reemplaza app.js según la persona */
      --crema: #fff6d6;
      --noche: #05050f;
      --vidrio: rgba(255, 255, 255, .07);
      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --texto: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--noche);
      color: var(--crema);
      font-family: var(--texto);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Escena 3D ---------- */
    #stage { position: fixed; inset: 0; z-index: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    /* ---------- Pantalla de inicio ---------- */
    .intro {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      text-align: center;
      padding: max(7vh, env(safe-area-inset-top)) 24px max(8vh, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 50%, transparent 32%, rgba(3, 3, 12, .72) 100%);
      transition: opacity 1.2s ease, visibility 0s linear 1.2s;
    }
    .intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }

    .intro__titulo {
      margin: 0;
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(2.3rem, 8.4vw, 5.4rem);
      line-height: 1.02;
      letter-spacing: -.015em;
      color: var(--crema);
      text-shadow: 0 0 44px color-mix(in srgb, var(--acento) 55%, transparent), 0 2px 20px rgba(0, 0, 0, .5);
      text-wrap: balance;
    }
    .intro__sub {
      margin: 1.1rem auto 0;
      max-width: 34ch;
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      line-height: 1.5;
      color: rgba(255, 246, 214, .82);
    }

    .go {
      position: relative;
      font: 700 1.08rem/1 var(--texto);
      padding: 1.15rem 2.3rem;
      min-height: 52px;
      border: 0; border-radius: 999px;
      color: #2b1a00;
      background: linear-gradient(135deg, #fff3b0 0%, var(--acento) 55%, #ffb300 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .45),
        0 12px 40px -10px var(--acento),
        0 0 70px -12px var(--acento);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .go::after {
      content: ''; position: absolute; inset: -9px; border-radius: inherit;
      border: 1.5px solid var(--acento);
      opacity: 0; animation: anillo 2.6s ease-out infinite;
      pointer-events: none;
    }
    .go:hover { transform: translateY(-2px) scale(1.035); }
    .go:active { transform: scale(.98); }
    .go:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .intro__hint { margin: 1.1rem 0 0; font-size: .92rem; color: rgba(255, 246, 214, .6); }

    /* Única secuencia de entrada de la página */
    .intro__top, .intro__bottom { animation: aparecer 1.6s cubic-bezier(.2, .7, .2, 1) both; }
    .intro__bottom { animation-delay: .7s; }

    @keyframes aparecer { from { opacity: 0; filter: blur(10px); transform: translateY(10px); } to { opacity: 1; filter: none; transform: none; } }
    @keyframes anillo   { 0% { transform: scale(.92); opacity: .75; } 100% { transform: scale(1.3); opacity: 0; } }

    /* ---------- Tarjeta de mensaje ---------- */
    .card {
      position: fixed; inset: 0; z-index: 8;
      display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .card__box {
      width: min(440px, 100%);
      padding: 34px 30px 24px;
      border-radius: 30px;
      text-align: center;
      background: linear-gradient(160deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .03));
      border: 1px solid rgba(255, 255, 255, .22);
      border: 1px solid color-mix(in srgb, var(--acento) 38%, transparent);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 34px 90px -34px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .16);
      opacity: 0; transform: translateY(16px) scale(.97);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2, .7, .2, 1);
    }
    .card.show .card__box { opacity: 1; transform: none; pointer-events: auto; }
    .card.min .card__box  { opacity: 0; transform: translateY(22px) scale(.96); pointer-events: none; transition-duration: .5s; }

    .card__nombre {
      margin: 0 0 .9rem;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.9rem, 6.4vw, 2.6rem);
      line-height: 1.1;
      color: var(--crema);
      text-shadow: 0 0 30px color-mix(in srgb, var(--acento) 60%, transparent);
    }
    .card__msg {
      margin: 0 auto;
      max-width: 36ch;
      font-size: clamp(1rem, 2.9vw, 1.1rem);
      line-height: 1.7;
      color: rgba(255, 248, 225, .93);
      text-wrap: pretty;
    }
    .card__pie {
      margin: 1.5rem 0 0; padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, .16);
      display: flex; flex-direction: column; gap: .8rem; align-items: center;
      font-size: .92rem; color: rgba(255, 246, 214, .72);
    }

    .ghost {
      font: 500 .95rem/1 var(--texto);
      color: var(--crema);
      padding: .8rem 1.3rem; min-height: 44px;
      border-radius: 999px;
      background: var(--vidrio);
      border: 1px solid rgba(255, 255, 255, .24);
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .ghost:hover { background: rgba(255, 255, 255, .14); transform: translateY(-1px); }
    .ghost:focus-visible, .icon:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }

    /* Botón flotante para reabrir el mensaje */
    .chip {
      position: fixed; z-index: 9;
      left: max(16px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .5s ease .3s, transform .5s ease .3s, visibility 0s linear .8s;
    }
    .chip.show { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

    /* Botón violeta del modo "por los jajas" */
    .go--jajas {
      color: #fff;
      background: linear-gradient(135deg, #f0abfc 0%, #a855f7 55%, #6d28d9 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4), 0 12px 40px -10px #a855f7, 0 0 70px -12px #a855f7;
    }
    .go--jajas::after { border-color: #c084fc; animation-delay: 1.3s; }
    .intro__botones { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 18px; }

    /* Si el mensaje es largo, la tarjeta se desplaza sin salirse de la pantalla */
    .card__box { max-height: calc(100dvh - 40px); overflow-y: auto; }

    /* ---------- Dock: minireproductor + cambio de modo ---------- */
    .dock {
      position: fixed; z-index: 9;
      top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      opacity: 0; visibility: hidden; transform: translateY(-8px);
      transition: opacity 1s ease 1s, transform 1s ease 1s, visibility 0s linear 2s;
    }
    .dock.show { opacity: 1; visibility: visible; transform: none; transition-delay: 1s, 1s, 0s; }

    .player {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 10px;
      width: min(292px, calc(100vw - 28px));
      padding: 9px 9px 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 18px 50px -22px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .14);
    }
    .player[hidden], .modo[hidden] { display: none; }

    /* Portada redonda que gira como un vinilo mientras suena */
    .player__disco {
      position: relative; flex: none;
      width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--acento) 70%, #fff), #5b3a00);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .2), 0 6px 18px -6px var(--acento);
      animation: girar 14s linear infinite; animation-play-state: paused;
    }
    .player.play .player__disco { animation-play-state: running; }
    .player__disco img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .player__disco::after {            /* agujero central */
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
      background: var(--noche); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .4);
    }
    .player__nota { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.2rem; }
    .player__disco.tiene-img .player__nota { display: none; }

    .player__info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .player__titulo, .player__artista { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player__titulo { font: 700 .94rem/1.2 var(--texto); color: var(--crema); }
    .player__artista { font: 400 .78rem/1.2 var(--texto); color: rgba(255, 246, 214, .66); }

    .player__btn {
      flex: none; width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center;
      border: 0; background: rgba(255, 255, 255, .1); color: var(--crema);
      font-size: .95rem; cursor: pointer; transition: background .2s ease, transform .2s ease;
    }
    .player__btn:hover { background: rgba(255, 255, 255, .22); transform: scale(1.06); }
    .player__btn:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

    .player__barra { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .1); }
    .player__barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), #fff3b0); }

    .modo {
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, .08);
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    /* Aviso si WebGL no está disponible */
    .aviso {
      position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 24px;
      text-align: center; background: var(--noche); font-size: 1.1rem; line-height: 1.6;
    }
    .aviso.show { display: grid; }

    /* Móvil: la tarjeta baja para dejar ver el planeta y las flores */
    @media (max-width: 640px) {
      .card { place-items: end center; padding-bottom: max(5vh, env(safe-area-inset-bottom)); }
      .card__box { padding: 26px 22px 20px; border-radius: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro__top, .intro__bottom { animation: none; }
      .go::after { animation: none; }
      .player__disco { animation: none; }
      .card__box, .intro { transition-duration: .01s; }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:2rem;text-align:center">Necesitas activar JavaScript para ver esta sorpresa 🌼</p></noscript>

  <!-- Lienzo Three.js -->
  <div id="stage" aria-hidden="true"></div>

  <!-- Pantalla de inicio -->
  <main class="intro" id="intro">
    <div class="intro__top">
      <h1 class="intro__titulo">Día de las<br>Flores Amarillas</h1>
      <p class="intro__sub" id="intro-sub">Un viaje estelar te espera.</p>
    </div>
    <div class="intro__bottom">
      <div class="intro__botones" id="intro-botones"></div>
      <p class="intro__hint" id="intro-hint">Sube el volumen 🎧</p>
    </div>
  </main>

  <!-- Tarjeta con el mensaje personalizado -->
  <section class="card" id="card" aria-live="polite">
    <div class="card__box" role="dialog" aria-labelledby="card-nombre">
      <h2 class="card__nombre" id="card-nombre"></h2>
      <p class="card__msg" id="card-msg"></p>
      <div class="card__pie">
        <span id="card-pie"></span>
        <button class="ghost" id="btn-min" type="button">Ver las flores 🌼</button>
      </div>
    </div>
  </section>

  <button class="ghost chip" id="btn-chip" type="button">💌 Mi mensaje</button>
  <!-- Minireproductor (esquina superior derecha) + cambio de modo -->
  <div class="dock" id="dock">
    <div class="player" id="player">
      <div class="player__disco" id="p-disco">
        <span class="player__nota">🎵</span>
        <img id="p-img" alt="" hidden>
      </div>
      <div class="player__info">
        <span class="player__titulo" id="p-titulo"></span>
        <span class="player__artista" id="p-artista"></span>
      </div>
      <button class="player__btn" id="p-play" type="button" aria-label="Pausar">⏸</button>
      <button class="player__btn" id="p-vol" type="button" aria-label="Silenciar">🔊</button>
      <div class="player__barra"><i id="p-barra"></i></div>
    </div>
    <button class="ghost modo" id="btn-modo" type="button" hidden></button>
  </div>

  <div class="aviso" id="aviso">
    <p>Tu navegador no pudo iniciar la escena 3D.<br>Prueba abrir este enlace en Chrome o Safari actualizado 🌼</p>
  </div>

  <!-- crossorigin="anonymous" según lo pedido; el módulo es del mismo origen -->
  <script type="module" src="./app.js" crossorigin="anonymous"></script>
</body>
</html>
